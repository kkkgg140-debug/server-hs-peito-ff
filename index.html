<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMX IA - HS Panel</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #151515; padding: 30px; border-radius: 20px; border: 2px solid #00ff88; text-align: center; box-shadow: 0 0 20px #00ff88; width: 80%; max-width: 350px; }
        h1 { color: #00ff88; margin-bottom: 10px; }
        .status { background: #222; padding: 15px; border-radius: 10px; text-align: left; margin: 20px 0; border-left: 4px solid #00ff88; }
        .line { display: flex; justify-content: space-between; margin: 5px 0; font-size: 14px; }
        .val { color: #00ff88; font-weight: bold; }
        .btn { background: #00ff88; color: black; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h1>CMX IA 🚀</h1>
        <p>Regedit Online Server</p>
        <div class="status">
            <div class="line"><span>Status:</span> <span class="val">ONLINE</span></div>
            <div class="line"><span>HS Value:</span> <span class="val">1.0</span></div>
            <div class="line"><span>Antena:</span> <span class="val">ACTIVE</span></div>
        </div>
        <a href="/config" class="btn">VER JSON CONFIG</a>
        <p style="font-size: 10px; opacity: 0.5; margin-top: 20px;">Created by @orowiczmodzz</p>
    </div>
</body>
  </html>
